# Client-specific settings. Values below are PLACEHOLDERS: fill in after the
# go/no-go checks. Do not put account IDs or credentials in this file.
client: restaurant_chain
currency: SEK
# Optional: remove these if campaign names do not show location/offer
# location_rule:
#   source: campaign_name
#   pattern: ""
# offer_rule:
#   source: campaign_name
#   pattern: ""

# Input exports (T1). Paths are relative to the repo root.
# Column names are the actual headers in the exported files.
# Do not put account IDs or credentials in this file.
input:
  title_lines: 2
  encoding: utf-8-sig
  delimiter: ","
  decimal: "."
  thousands: ","
  files:
    day:
      path: data/raw/campaign_by_day_2023-2026_2026-11-12.csv
      output: outputs/interim/campaign_by_day.csv
    month:
      path: data/raw/campaign_by_month_2015-2023_2026-11-12.csv
      output: outputs/interim/campaign_by_month.csv

# Columns: logical name -> header in the exported file.
# The date header differs by file (Day in the day file, Month in
# the month file), so it is given per kind. Impressions is optional:
# its header name is not known, so it is null — do not guess it.
columns:
  date:
    day: Day
    month: Month
  campaign: Campaign
  cost: Cost
  clicks: Clicks
  conversions: Conversions
  impressions: "Impr."

required_columns: [date, campaign, cost, clicks, conversions]

# Analysis ranges (T2). Decided by the student, 2026-11-12.
# Daily data is used from daily_start to daily_end. Monthly data
# is used for long-term trends only, up to monthly_end; there is
# no monthly start limit. Missing days are NOT filled: a missing
# day means no activity.
analysis:
  daily_start: "2024-07-01"
  daily_end: "2026-11-12"
  monthly_end: "2023-09-30"
  # Campaign selection (T3a). Both empty means use all campaigns.
  # If include_campaigns is not empty, only those campaigns are
  # used. exclude_campaigns removes campaigns after that.
  # Do not guess any names: fill these in from the overview table.
  include_campaigns: []
  exclude_campaigns: []
  # Campaign groups (T3). Provisional, until the owner answers
  # the two questions in docs/decision-log.md. A campaign in no
  # group goes to "ungrouped" and is reported, never dropped.
  # sep_2026_group matches exact names and any name starting
  # with the given prefix.
  campaign_groups:
    core:
      - The South Indian Stockholm
      - Authentic Indian Restaurant
      - Restaurang The South Indian
      - South Indian Restaurant
      - Indisk Mat i Södertälje
      - Website traffic-Performance Max-2
    sep_2026_group:
      exact:
        - Super Sales Campaign
        - The South Indian Sweden Campaign
      prefix: "The South Indian Campaign"
    monthly_history_only:
      - Ny Restaurang i Örebro
      - Brand awareness and reach-Display-1
      - Grand Opening
      - Halal Restaurant
      - The South Indian Kista
      - The South Indian Sodermalm
    exclude_pending_owner:
      - DrTiwari
      - DrTiwariPersonal
      - Lorry booking
      - Yoga Mela - Yoga och Gratis Music Konsert
      - Campaign #2
      - Sales-Search-8
  # Volume rule (T3). Provisional, to be confirmed by the student.
  volume_rule:
    min_conversions: 10
    min_days_active: 14
  # Time patterns (T4). Analysis uses only the groups in
  # time_groups; sep_2026_group gets runs only. A weekday cell
  # below weekday_min_conversions is flagged insufficient_data.
  # A gap of more than run_gap_days with no activity starts a
  # new run. Both values are provisional.
  time_groups: [core]
  weekday_min_conversions: 5
  run_gap_days: 14
  # Recommendation rules (T5). Provisional, the student's
  # decision, 2026-11-12. The benchmark is calculated, not
  # typed in: core group overall cost per conversion = sum of
  # core spend / sum of core conversions.
  # The caveat text (T8) is written here once and used
  # everywhere: recommend.py, the reports and the dashboard read
  # it from the config instead of their own text.
  caveat_text: "Tracked actions only (mainly get-directions requests and phone calls), not bookings or orders. This shows campaign performance, not proof that an offer brought extra customers."
  recommendation_rules:
    continue_max_ratio: 1.0
    test_max_ratio: 2.0
    repeat_min_runs: 2
    # Recommendation improvements (T5b), provisional. A campaign
    # is active if its last active date is within
    # active_window_days of the latest date in the daily data.
    # The sensitivity lists vary the two thresholds; only
    # combinations where continue <= test are used.
    active_window_days: 14
    sensitivity_continue_max_ratio: [0.75, 1.0, 1.25, 1.5]
    sensitivity_test_max_ratio: [1.5, 2.0, 3.0]
  # Recent trend (T11). Provisional, the student's decision,
  # 2026-11-12. The last conversion_lag_days of data are
  # excluded from recent windows, because tracked actions can
  # be reported with a delay; that lag is not verified.
  recent_trend:
    recent_window_days: 28
    conversion_lag_days: 3
    worsening_ratio: 1.5
    improving_ratio: 0.67
    worsening_vs_prior_ratio: 1.3
    improving_vs_prior_ratio: 0.77
    min_tracked_actions_in_window: 30
  # What-if weekday shift (T12). Provisional, the student's
  # decision, 2026-11-16. Share of Mon-Fri spend moved to
  # Sat-Sun in the what-if.
  what_if:
    shift_share: 0.10
  # Break-even (T12). Provisional, the student's decision,
  # 2026-11-16. Average revenue per visit: null because the
  # owner has not given a revenue value yet; while it is null
  # the break-even output is skipped with a message.
  break_even:
    avg_revenue_per_visit: null
  outputs:
    day: outputs/interim/clean_day.csv
    month: outputs/interim/clean_month.csv
    report: outputs/reports/cleaning-report.md
    overview: outputs/reports/campaign-overview.csv
    campaign_summary_day: outputs/results/campaign_summary_day.csv
    campaign_summary_month: outputs/results/campaign_summary_month.csv
    group_summary: outputs/results/group_summary.csv
    metrics_report: outputs/reports/metrics-report.md
    weekday_by_campaign: outputs/results/weekday_by_campaign.csv
    weekday_core: outputs/results/weekday_core.csv
    monthly_by_campaign: outputs/results/monthly_by_campaign.csv
    timeline_by_campaign: outputs/results/timeline_by_campaign.csv
    runs: outputs/results/runs.csv
    time_report: outputs/reports/time-report.md
    recommendations_by_run: outputs/results/recommendations_by_run.csv
    recommendations_by_campaign: outputs/results/recommendations_by_campaign.csv
    recommendation_sensitivity: outputs/results/recommendation_sensitivity.csv
    recommend_report: outputs/reports/recommend-report.md
    recent_trend: outputs/results/recent_trend.csv
    weekly_by_campaign: outputs/results/weekly_by_campaign.csv
    recent_trend_report: outputs/reports/recent-trend-report.md
    journey_by_campaign: outputs/results/journey_by_campaign.csv
    what_if_weekday_shift: outputs/results/what_if_weekday_shift.csv
    break_even: outputs/results/break_even.csv
    journey_report: outputs/reports/journey-report.md

# Conversion breakdown (T10). The conversion-by-campaign-month
# export has 2 title lines, then a header. Column names are the
# actual headers in the exported file; the loader fails naming
# any that are missing. Action groups are provisional, the
# student's decision, 2026-11-12. Names are compared
# case-insensitively, and hyphen, en dash and em dash count as
# equal. Any other action goes to "unmapped" and is reported,
# never dropped.
conversion_breakdown:
  file:
    path: data/raw/conversion_by_campaign_month_2026-11-12.csv
    title_lines: 2
  columns:
    campaign: Campaign
    month: Month
    action: Conversion action
    conversions: Conversions
    all_conversions: All conv.
  ui_expected:
    conversions: 39989.84
    all_conversions: 234853.27
    tolerance: 0.05
  action_groups:
    high_intent:
      - Local actions - Directions
      - Store visits
      - Local actions - Orders
      - Clicks to call
      - Calls from ads
      - Calls from Smart Campaign Ads
      - Calls
      - Business profile - Directions
      - Business profile - Call
      - Business profile - Tracked call
      - Smart campaign map directions
      - Smart campaign ad clicks to call
      - Smart campaign map clicks to call
      - Purchase
      - Book appointment
      - Submit lead forms
    engagement:
      - Local actions - Other engagements
      - Local actions - Menu views
      - Local actions - Website visits
      - Business profile - Learn more
  # Intent categories (T12). Subsets of the high-intent
  # actions, used for the acquisition journey: directions,
  # calls and store visits as shares of tracked actions.
  # Compared like action groups (case-insensitive, all dash
  # types equal). A category may be empty.
  intent_categories:
    directions:
      - Local actions - Directions
      - Business profile - Directions
      - Smart campaign map directions
    calls:
      - Clicks to call
      - Calls from ads
      - Calls from Smart Campaign Ads
      - Calls
      - Business profile - Call
      - Business profile - Tracked call
      - Smart campaign ad clicks to call
      - Smart campaign map clicks to call
    store_visits:
      - Store visits
  outputs:
    mix_by_campaign: outputs/results/conversion_mix_by_campaign.csv
    mix_by_campaign_month: outputs/results/conversion_mix_by_campaign_month.csv
    mix_by_run: outputs/results/conversion_mix_by_run.csv
    campaign_summary_intent: outputs/results/campaign_summary_intent.csv
    report: outputs/reports/conversion-breakdown-report.md
