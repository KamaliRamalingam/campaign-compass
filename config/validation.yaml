# Export validation config (T0b).
# Fill ui_expected in from the Google Ads UI after the exports,
# before running: python src/validate_exports.py --config config/validation.yaml --out docs/validation-report.md
# Leave a value empty (null) to skip that one check.
# Column names below are the actual headers read from the exported files.
# Do not put account IDs, credentials or client names in this file.
files:
  - path: data/raw/campaign_by_day_2023-2026_2026-11-12.csv
    kind: campaign_by_day
    columns:
      clicks: Clicks
      cost: Cost
      conversions: Conversions
      date: Day
      campaign: Campaign
    title_lines: 2
    delimiter: ","
    encoding: utf-8-sig
    decimal: "."
    thousands: ","
    ui_expected:
      rows: null
      clicks: null
      cost: null
      conversions: null
      date_start: null
      date_end: null
    tolerance:
      cost: 0.05
      conversions: 0.01
  - path: data/raw/campaign_by_month_2015-2023_2026-11-12.csv
    kind: campaign_by_month
    columns:
      clicks: Clicks
      cost: Cost
      conversions: Conversions
      date: Month
      campaign: Campaign
    title_lines: 2
    delimiter: ","
    encoding: utf-8-sig
    decimal: "."
    thousands: ","
    ui_expected:
      rows: null
      clicks: null
      cost: null
      conversions: null
      date_start: null
      date_end: null
    tolerance:
      cost: 0.05
      conversions: 0.01
  - path: data/raw/monthly_totals_2026-11-12.csv
    kind: monthly_totals
    columns:
      clicks: Clicks
      cost: Cost
      conversions: Conversions
      date: Month
      campaign: null
    title_lines: 2
    delimiter: ","
    encoding: utf-8-sig
    decimal: "."
    thousands: ","
    ui_expected:
      rows: null
      clicks: null
      cost: null
      conversions: null
      date_start: null
      date_end: null
    tolerance:
      cost: 0.05
      conversions: 0.01
