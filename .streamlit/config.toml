# Dashboard theme (PR 5): light, navy accents, plenty of white
# space. Read by `bash dashboard.sh`, which runs from the repo root.
# Localhost-only and usage-statistics settings stay in dashboard.sh.
[theme]
base = "light"
primaryColor = "#1F3A5F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F9"
textColor = "#1C2430"
