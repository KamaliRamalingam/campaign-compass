# Dashboard theme (redesign): warm spice, matching the restaurant's
# website. Cards are white with a #EADFCF border (CSS in
# dashboard/app.py). Deep green is only for the header line, the
# active navigation tab and buttons. Read by `bash dashboard.sh`,
# which runs from the repo root. Localhost-only and usage-statistics
# settings stay in dashboard.sh.
[theme]
base = "light"
primaryColor = "#254C31"
backgroundColor = "#FBF6EE"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#3B2F2A"
font = "sans-serif"

[client]
# Hide the developer toolbar (Deploy button) in the header.
toolbarMode = "viewer"
